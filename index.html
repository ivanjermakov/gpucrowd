<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gpucrowd</title>
    <style>
        :root {
    --bg: #ffffff;
    --bg2: #f4f4f4;
    --bg3: #dddddd;
    --fg: #000000;
    --fg2: #111111;
    --fg3: #444444;
    --special: #c955e7;
    --green: #00aa00;
    --red: #cc0000;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #111111;
        --bg2: #222222;
        --bg3: #444444;
        --fg: #ffffff;
        --fg2: #eeeeee;
        --fg3: #aaaaaa;
        --green: #55ff55;
        --red: #ff5555;
    }
}

body {
    background-color: var(--bg);
    color: var(--fg);
}

html {
    font-size: 16px;
    overscroll-behavior: none;
}

html,
body,
#root {
    margin: 0;
    width: 100%;
    height: 100%;
}

* {
    font-family: 'Space Mono', monospace;
    font-variant-ligatures: none;
    border-width: 0;
    border-style: solid;
    border-color: var(--bg3);
}

h1 {
    margin-block: 2rem;
}

h2 {
    margin-block: 0.5rem 0.5rem;
}

h3 {
    margin-block: 0.3rem 0.3rem;
}

p {
    margin: 0;
}

a {
    color: var(--fg);

    &:hover {
        color: var(--special);

        i {
            color: var(--special);
        }
    }
}

i {
    color: var(--fg);
}

*:focus {
    outline: 1px solid var(--special);
}

input {
    background-color: var(--bg2);
    color: var(--fg);
    border-width: 1px;
    font-size: 1rem;
}

input[type="range"] {
    accent-color: var(--special)
}

button {
    background-color: var(--bg2);
    color: var(--fg);
    border-width: 1px;
    font-size: 1rem;

    &:hover {
        border-color: var(--special);
    }

    &:disabled {
        color: var(--fg3);

        &:hover {
            background-color: var(--bg2);
        }
    }

    &.active {
        color: var(--special);
        border-color: var(--special);
    }
}

select {
    background: var(--bg2);
    color: var(--fg);
    outline: none;
    border-width: 1px;
    font-size: 1rem;
}

.main {
    width: 100%;
    max-width: 1080px;
    display: flex;
    flex-direction: column;
    padding-inline: 4px;
}

table {
    border-collapse: separate;
    border-spacing: 0;
}

td, th {
    text-align: left;
    padding-inline: .5ch;
    white-space: nowrap;
}

tr {
    td, th {
        background-color: var(--bg);
    }

    &:nth-child(even) {
        td, th {
            background-color: var(--bg2);
        }
    }
}

th {
    font-size: 0.8rem;
}

.right {
    text-align: right;
}
    </style>
  </head>
  <body>{body}</body>
</html>
